name: waha-marketing

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha-marketing-engine
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-waha_marketing_secret_key}
      WAHA_DASHBOARD_ENABLED: "false"
      WAHA_PRINT_QR: "False"
      WAHA_LOG_LEVEL: info
      WHATSAPP_HOOK_URL: http://web:3050/api/webhook
      WHATSAPP_HOOK_EVENTS: message,message.any,message.ack,session.status
    volumes:
      - ./waha_sessions:/app/.sessions
    networks:
      - waha-marketing-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waha-marketing-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:3050"
    environment:
      NODE_ENV: production
      PORT: 3050
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-waha_marketing_secret_key}
      APP_DOCKER_URL: http://web:3050
      NEXT_PUBLIC_APP_URL: https://waha.deployroom.my.id
      DATABASE_URL: "file:/app/prisma/dev.db"
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
      - ./public/uploads:/app/public/uploads
      - ./waha_sessions:/app/waha_sessions:ro
    depends_on:
      - waha
    networks:
      - waha-marketing-net

networks:
  waha-marketing-net:
    driver: bridge
